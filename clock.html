<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>똑똑 시계 대장! - 아날로그 시계 읽기 연습</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Gaegu & Nanum Gothic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #F0FDF4;
            background-image: radial-gradient(#BBF7D0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-gaegu {
            font-family: 'Gaegu', cursive;
        }

        /* custom keyframe animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Clock SVG styling */
        .clock-shadow {
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.12));
        }

        /* Number pad buttons */
        .numpad-btn {
            transition: all 0.1s ease;
            box-shadow: 0 3px 0 #CBD5E1;
        }
        .numpad-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #CBD5E1;
        }

        .btn-action {
            transition: all 0.1s ease;
        }
        .btn-action:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body class="h-dvh max-h-dvh min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-gray-800 overflow-hidden">

    <!-- Header & Scoreboard -->
    <header class="w-full max-w-md lg:max-w-4xl flex flex-col items-center gap-1.5 shrink-0">
        <!-- Title -->
        <div class="flex items-center gap-1.5">
            <span class="text-2xl sm:text-3xl">⏰</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-emerald-600 tracking-tight font-gaegu drop-shadow-sm">
                똑똑 시계 대장!
            </h1>
        </div>

        <!-- Scoreboard Badge Row -->
        <div class="w-full grid grid-cols-4 gap-1 sm:gap-2 bg-white p-2 rounded-2xl shadow-sm border border-emerald-100 text-center">
            <div class="flex flex-col items-center">
                <span class="text-[10px] sm:text-xs text-gray-500 font-bold">도전</span>
                <span id="score-total" class="text-base sm:text-lg font-black text-gray-700">0</span>
            </div>
            <div class="flex flex-col items-center border-l border-gray-100">
                <span class="text-[10px] sm:text-xs text-emerald-500 font-bold">정답 ⭕</span>
                <span id="score-correct" class="text-base sm:text-lg font-black text-emerald-600">0</span>
            </div>
            <div class="flex flex-col items-center border-l border-gray-100">
                <span class="text-[10px] sm:text-xs text-rose-500 font-bold">오답 ❌</span>
                <span id="score-incorrect" class="text-base sm:text-lg font-black text-rose-500">0</span>
            </div>
            <div class="flex flex-col items-center border-l border-gray-100">
                <span class="text-[10px] sm:text-xs text-amber-500 font-bold">정답률</span>
                <span id="score-accuracy" class="text-base sm:text-lg font-black text-amber-600">0%</span>
            </div>
        </div>
    </header>

    <!-- Main Game Container (Mobile Column, PC/Tablet Row) -->
    <main class="w-full max-w-md lg:max-w-4xl flex-1 bg-white rounded-3xl shadow-xl border-2 sm:border-4 border-emerald-300 p-3 sm:p-5 flex flex-col lg:flex-row items-center justify-between gap-3 overflow-hidden my-1">
        
        <!-- Left / Top Column: Level & Clock -->
        <div class="w-full lg:w-1/2 flex flex-col items-center justify-between h-full max-h-[50vh] lg:max-h-full">
            <!-- Level Selector Tabs -->
            <div class="w-full grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold shrink-0">
                <button onclick="setLevel(1)" id="lvl-btn-1" class="lvl-btn py-1.5 rounded-lg transition-all bg-emerald-500 text-white shadow-sm">
                    1단계<br><span class="text-[9px] font-normal opacity-90 sm:text-[10px]">정시</span>
                </button>
                <button onclick="setLevel(2)" id="lvl-btn-2" class="lvl-btn py-1.5 rounded-lg transition-all text-gray-600 hover:bg-slate-200">
                    2단계<br><span class="text-[9px] font-normal opacity-90 sm:text-[10px]">30분</span>
                </button>
                <button onclick="setLevel(3)" id="lvl-btn-3" class="lvl-btn py-1.5 rounded-lg transition-all text-gray-600 hover:bg-slate-200">
                    3단계<br><span class="text-[9px] font-normal opacity-90 sm:text-[10px]">5분 단위</span>
                </button>
                <button onclick="setLevel(4)" id="lvl-btn-4" class="lvl-btn py-1.5 rounded-lg transition-all text-gray-600 hover:bg-slate-200">
                    4단계<br><span class="text-[9px] font-normal opacity-90 sm:text-[10px]">1분 단위</span>
                </button>
            </div>

            <!-- Analog Clock Container (Responsive Dynamic Aspect Ratio) -->
            <div class="relative aspect-square h-full max-h-[220px] sm:max-h-[280px] lg:max-h-[320px] my-auto flex justify-center items-center p-1">
                <!-- SVG Analog Clock -->
                <svg id="analog-clock" viewBox="0 0 300 300" class="w-full h-full clock-shadow animate-float">
                    <!-- Outer Bezel -->
                    <circle cx="150" cy="150" r="142" fill="#FFFFFF" stroke="#10B981" stroke-width="12" />
                    <circle cx="150" cy="150" r="135" fill="none" stroke="#D1FAE5" stroke-width="3" />

                    <!-- Minute Tick Marks (60 ticks) & Hour Tick Marks (12 ticks) -->
                    <g id="clock-ticks"></g>

                    <!-- Hour Numbers (1~12) -->
                    <g id="clock-numbers"></g>

                    <!-- Hour Hand Group (Short Red Hand) -->
                    <g id="hour-hand-group" transform="rotate(0 150 150)">
                        <line x1="150" y1="150" x2="150" y2="75" stroke="rgba(0,0,0,0.15)" stroke-width="10" stroke-linecap="round" transform="translate(2, 4)" />
                        <line x1="150" y1="160" x2="150" y2="75" stroke="#EF4444" stroke-width="9" stroke-linecap="round" />
                        <circle cx="150" cy="75" r="7" fill="#EF4444" />
                    </g>

                    <!-- Minute Hand Group (Long Blue Hand) -->
                    <g id="minute-hand-group" transform="rotate(0 150 150)">
                        <line x1="150" y1="150" x2="150" y2="45" stroke="rgba(0,0,0,0.15)" stroke-width="6" stroke-linecap="round" transform="translate(2, 4)" />
                        <line x1="150" y1="170" x2="150" y2="40" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" />
                        <circle cx="150" cy="40" r="5" fill="#3B82F6" />
                    </g>

                    <!-- Center Cap Base & Pin -->
                    <circle cx="150" cy="150" r="10" fill="#1E293B" />
                    <circle cx="150" cy="150" r="4" fill="#F8FAFC" />
                </svg>
            </div>

            <!-- Guide Label -->
            <div class="text-center shrink-0">
                <p class="text-xs sm:text-sm font-bold text-gray-500">
                    <span class="text-red-500 font-black">시(짧은 바늘)</span>와 <span class="text-blue-500 font-black">분(긴 바늘)</span>을 맞혀보세요!
                </p>
            </div>
        </div>

        <!-- Right / Bottom Column: Controls & Keypad -->
        <div class="w-full lg:w-1/2 flex flex-col items-center justify-center gap-2 sm:gap-3 shrink-0">
            <!-- Time Input Section -->
            <div class="w-full flex items-center justify-center gap-2 sm:gap-4 bg-slate-50 p-2 sm:p-3 rounded-2xl border border-slate-200">
                <!-- Hour Input -->
                <div class="flex flex-col items-center">
                    <span class="text-[11px] font-bold text-red-500 mb-0.5">시 (짧은 바늘)</span>
                    <input type="text" id="input-hour" readonly onclick="setActiveInput('hour')"
                        class="w-14 h-11 sm:w-16 sm:h-12 text-center text-xl sm:text-2xl font-black text-red-600 bg-white border-2 sm:border-4 border-red-300 rounded-xl focus:outline-none cursor-pointer shadow-inner"
                        placeholder="시">
                </div>

                <span class="text-2xl font-black text-gray-400 mt-3">:</span>

                <!-- Minute Input -->
                <div class="flex flex-col items-center">
                    <span class="text-[11px] font-bold text-blue-500 mb-0.5">분 (긴 바늘)</span>
                    <input type="text" id="input-minute" readonly onclick="setActiveInput('minute')"
                        class="w-16 h-11 sm:w-20 sm:h-12 text-center text-xl sm:text-2xl font-black text-blue-600 bg-white border-2 sm:border-4 border-blue-300 rounded-xl focus:outline-none cursor-pointer shadow-inner"
                        placeholder="분">
                </div>
            </div>

            <!-- On-Screen Keypad (Compact Grid) -->
            <div class="w-full max-w-xs grid grid-cols-3 gap-1.5 bg-slate-100 p-2 rounded-2xl border border-slate-200">
                <button onclick="pressKey('1')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">1</button>
                <button onclick="pressKey('2')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">2</button>
                <button onclick="pressKey('3')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">3</button>
                <button onclick="pressKey('4')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">4</button>
                <button onclick="pressKey('5')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">5</button>
                <button onclick="pressKey('6')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">6</button>
                <button onclick="pressKey('7')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">7</button>
                <button onclick="pressKey('8')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">8</button>
                <button onclick="pressKey('9')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">9</button>
                <button onclick="pressKey('CLEAR')" class="numpad-btn bg-amber-100 text-amber-700 font-bold text-xs py-1.5 sm:py-2 rounded-lg border border-amber-200 flex items-center justify-center">지우기</button>
                <button onclick="pressKey('0')" class="numpad-btn bg-white text-gray-800 font-extrabold text-lg sm:text-xl py-1.5 sm:py-2 rounded-lg border border-slate-200">0</button>
                <button onclick="pressKey('BACK')" class="numpad-btn bg-slate-200 text-slate-700 font-bold text-sm py-1.5 sm:py-2 rounded-lg border border-slate-300 flex items-center justify-center">
                    <i class="fa-solid fa-delete-left text-base"></i>
                </button>
            </div>

            <!-- Submit Button -->
            <button onclick="checkAnswer()" id="btn-submit" 
                class="btn-action w-full max-w-xs py-2.5 sm:py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-lg rounded-xl shadow-md border-b-4 border-emerald-700 flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-check"></i>
                <span>정답 확인하기</span>
            </button>
        </div>

    </main>

    <!-- Feedback Modal / Card -->
    <div id="feedback-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col items-center text-center animate-pop border-4 border-emerald-400">
            <!-- Dynamic Icon/Graphic -->
            <div id="modal-icon" class="text-5xl mb-2">🎉</div>

            <!-- Header Title -->
            <h3 id="modal-title" class="text-2xl font-black text-gray-800 font-gaegu mb-1">정답입니다!</h3>

            <!-- Details & Hint Body -->
            <div id="modal-body" class="w-full bg-slate-50 p-3.5 rounded-2xl text-xs sm:text-sm text-gray-700 mb-4 border border-slate-200 text-left space-y-2 max-h-[50vh] overflow-y-auto">
                <!-- Dynamic text populated by JS -->
            </div>

            <!-- Action Buttons -->
            <button onclick="closeModalAndNext()" id="modal-btn" class="btn-action w-full py-2.5 bg-emerald-500 text-white font-black text-base rounded-xl shadow-md border-b-4 border-emerald-700">
                다음 문제 도전! 🚀
            </button>
        </div>
    </div>

    <!-- Footer Credit -->
    <footer class="text-center text-[10px] sm:text-xs text-gray-500 font-medium shrink-0">
        초등학교 1~2학년 수학 교과 연계 • 반응형 모바일 시계 읽기 교구
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- State Variables ---
        let currentLevel = 1;
        let targetHour = 3;
        let targetMinute = 0;

        let activeInput = 'hour'; // 'hour' or 'minute'
        
        let totalCount = 0;
        let correctCount = 0;
        let incorrectCount = 0;

        let autoNextTimeout = null;

        // --- Init Function ---
        window.onload = function () {
            renderClockDial();
            setLevel(1);
            setActiveInput('hour');
        };

        // --- Render SVG Clock Dial Lines & Numbers ---
        function renderClockDial() {
            const ticksGroup = document.getElementById('clock-ticks');
            const numbersGroup = document.getElementById('clock-numbers');

            ticksGroup.innerHTML = '';
            numbersGroup.innerHTML = '';

            const cx = 150;
            const cy = 150;

            // Render 60 ticks
            for (let i = 0; i < 60; i++) {
                const angleRad = (i * 6) * (Math.PI / 180);
                const isHourTick = i % 5 === 0;

                const innerR = isHourTick ? 116 : 123;
                const outerR = 129;

                const x1 = cx + innerR * Math.sin(angleRad);
                const y1 = cy - innerR * Math.cos(angleRad);
                const x2 = cx + outerR * Math.sin(angleRad);
                const y2 = cy - outerR * Math.cos(angleRad);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', isHourTick ? '#1E293B' : '#94A3B8');
                line.setAttribute('stroke-width', isHourTick ? '3.5' : '1.5');
                line.setAttribute('stroke-linecap', 'round');
                ticksGroup.appendChild(line);
            }

            // Render Numbers 1 ~ 12
            const numRadius = 100;
            for (let num = 1; num <= 12; num++) {
                const angleRad = (num * 30) * (Math.PI / 180);
                const x = cx + numRadius * Math.sin(angleRad);
                const y = cy - numRadius * Math.cos(angleRad) + 7; // slightly offset vertically for font baseline

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '22');
                text.setAttribute('font-weight', '800');
                text.setAttribute('fill', '#1E293B');
                text.setAttribute('font-family', "'Nanum Gothic', sans-serif");
                text.textContent = num;
                numbersGroup.appendChild(text);
            }
        }

        // --- Set Level ---
        function setLevel(lvl) {
            currentLevel = lvl;

            // Highlight Level Buttons
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`lvl-btn-${i}`);
                if (i === lvl) {
                    btn.className = "lvl-btn py-2 rounded-xl transition-all bg-emerald-500 text-white shadow-sm font-extrabold";
                } else {
                    btn.className = "lvl-btn py-2 rounded-xl transition-all text-gray-600 hover:bg-slate-200 font-semibold";
                }
            }

            generateNewQuestion();
        }

        // --- Generate Random Question Based on Level ---
        function generateNewQuestion() {
            // Random Hour: 1 to 12
            targetHour = Math.floor(Math.random() * 12) + 1;

            if (currentLevel === 1) {
                // 정시 (00분)
                targetMinute = 0;
            } else if (currentLevel === 2) {
                // 30분 단위 (0분 또는 30분)
                targetMinute = Math.random() < 0.5 ? 0 : 30;
            } else if (currentLevel === 3) {
                // 5분 단위 (0, 5, 10, ... 55)
                const step = Math.floor(Math.random() * 12);
                targetMinute = step * 5;
            } else if (currentLevel === 4) {
                // 1분 단위 (0 ~ 59)
                targetMinute = Math.floor(Math.random() * 60);
            }

            updateClockHands(targetHour, targetMinute);
            clearInputs();
            setActiveInput('hour');
        }

        // --- Update Clock Hands Angle Logic ---
        function updateClockHands(hour, minute) {
            // Minute Hand Angle = Minute * 6 deg
            const minuteAngle = minute * 6;

            // Hour Hand Angle = (hour % 12) * 30 deg + (minute / 60) * 30 deg
            // Precise mathematical inter-lock
            const hourAngle = ((hour % 12) * 30) + ((minute / 60) * 30);

            const hourGroup = document.getElementById('hour-hand-group');
            const minuteGroup = document.getElementById('minute-hand-group');

            // Apply SVG transforms smoothly
            hourGroup.setAttribute('transform', `rotate(${hourAngle} 150 150)`);
            minuteGroup.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
        }

        // --- Input Field Selection Logic ---
        function setActiveInput(type) {
            activeInput = type;
            const hourInput = document.getElementById('input-hour');
            const minuteInput = document.getElementById('input-minute');

            if (type === 'hour') {
                hourInput.classList.add('ring-4', 'ring-red-200', 'border-red-500');
                minuteInput.classList.remove('ring-4', 'ring-blue-200', 'border-blue-500');
            } else {
                minuteInput.classList.add('ring-4', 'ring-blue-200', 'border-blue-500');
                hourInput.classList.remove('ring-4', 'ring-red-200', 'border-red-500');
            }
        }

        function clearInputs() {
            document.getElementById('input-hour').value = '';
            document.getElementById('input-minute').value = '';
        }

        // --- On-Screen Keypad Handler ---
        function pressKey(key) {
            const inputEl = document.getElementById(activeInput === 'hour' ? 'input-hour' : 'input-minute');
            let val = inputEl.value;

            if (key === 'CLEAR') {
                inputEl.value = '';
                return;
            }

            if (key === 'BACK') {
                inputEl.value = val.slice(0, -1);
                return;
            }

            // Length limits
            if (activeInput === 'hour') {
                if (val.length >= 2) return;
                let newval = val + key;
                if (parseInt(newval) > 12) {
                    newval = key; // override if > 12
                }
                inputEl.value = newval;

                // Auto switch to minute if user typed valid 2-digit or 1-digit hour
                if (inputEl.value.length === 2 || parseInt(inputEl.value) >= 2) {
                    setTimeout(() => setActiveInput('minute'), 150);
                }
            } else {
                if (val.length >= 2) return;
                let newval = val + key;
                if (parseInt(newval) > 59) {
                    newval = key;
                }
                inputEl.value = newval;
            }
        }

        // --- Check Answer & Generate Feedback ---
        function checkAnswer() {
            const userHourVal = document.getElementById('input-hour').value.trim();
            const userMinVal = document.getElementById('input-minute').value.trim();

            if (userHourVal === '' || userMinVal === '') {
                showModal(
                    '⚠️',
                    '시와 분을 입력해 주세요!',
                    `<p class="text-center font-bold text-gray-700">짧은 바늘이 가리키는 <span class="text-red-500">시</span>와<br>긴 바늘이 가리키는 <span class="text-blue-500">분</span>을 모두 적어주세요.</p>`,
                    false
                );
                return;
            }

            const userHour = parseInt(userHourVal, 10);
            const userMin = parseInt(userMinVal, 10);

            totalCount++;

            const isCorrect = (userHour === targetHour) && (userMin === targetMinute);

            if (isCorrect) {
                correctCount++;
                updateScoreboard();
                triggerConfetti();

                showModal(
                    '🎉',
                    '참 잘했어요! 정답입니다!',
                    `<div class="text-center">
                        <p class="text-lg font-black text-emerald-600 mb-1">${targetHour}시 ${targetMinute === 0 ? '00' : targetMinute}분</p>
                        <p class="text-xs text-gray-500">시계 바늘의 위치를 정확하게 읽어냈어요!</p>
                     </div>`,
                    true
                );

                // Auto progress after 1.8 seconds if modal stays open
                autoNextTimeout = setTimeout(() => {
                    closeModalAndNext();
                }, 1800);

            } else {
                incorrectCount++;
                updateScoreboard();

                // Build Educational Hint
                const hintHTML = generateHintHTML(userHour, userMin, targetHour, targetMinute);

                showModal(
                    '💪',
                    '아쉬워요! 다시 확인해 볼까요?',
                    hintHTML,
                    false
                );
            }
        }

        // --- Generate Helpful Hint Explanation ---
        function generateHintHTML(userHour, userMin, targetHour, targetMinute) {
            let nextHourNum = targetHour === 12 ? 1 : targetHour + 1;
            
            let hourExplanation = '';
            if (targetMinute === 0) {
                hourExplanation = `짧은 바늘(빨간색)이 <b class="text-red-600">${targetHour}</b>를 똑바로 가리키고 있어요.`;
            } else {
                hourExplanation = `짧은 바늘(빨간색)이 <b class="text-red-600">${targetHour}</b>와 <b>${nextHourNum}</b> 사이에 있지만, 아직 ${nextHourNum}시가 되지 않았으므로 <b class="text-red-600">${targetHour}시</b>입니다.`;
            }

            let minExplanation = '';
            if (targetMinute === 0) {
                minExplanation = `긴 바늘(파란색)이 <b>12</b>를 가리키고 있으므로 <b class="text-blue-600">00분(정시)</b>입니다.`;
            } else if (targetMinute === 30) {
                minExplanation = `긴 바늘(파란색)이 <b>6</b>을 가리키고 있으므로 <b class="text-blue-600">30분</b>입니다.`;
            } else if (targetMinute % 5 === 0) {
                const targetNum = targetMinute / 5;
                minExplanation = `긴 바늘(파란색)이 숫자 <b>${targetNum}</b>을 가리키고 있어요. (5 × ${targetNum} = <b class="text-blue-600">${targetMinute}분</b>)`;
            } else {
                minExplanation = `긴 바늘(파란색)이 작은 눈금 <b class="text-blue-600">${targetMinute}번째</b> 위치에 있어요.`;
            }

            return `
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="p-2 bg-red-50 rounded-lg border border-red-100 text-gray-800">
                        📌 <b>시(짧은 바늘) 힌트:</b><br>${hourExplanation}
                    </div>
                    <div class="p-2 bg-blue-50 rounded-lg border border-blue-100 text-gray-800">
                        📌 <b>분(긴 바늘) 힌트:</b><br>${minExplanation}
                    </div>
                    <div class="mt-3 text-center pt-2 border-t border-slate-200">
                        <span class="text-gray-500 font-bold">정답: </span>
                        <span class="text-base font-black text-emerald-600">${targetHour}시 ${targetMinute}분</span>
                    </div>
                </div>
            `;
        }

        // --- Scoreboard Update ---
        function updateScoreboard() {
            document.getElementById('score-total').textContent = totalCount;
            document.getElementById('score-correct').textContent = correctCount;
            document.getElementById('score-incorrect').textContent = incorrectCount;

            const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
            document.getElementById('score-accuracy').textContent = `${accuracy}%`;
        }

        // --- Modal Display & Controls ---
        function showModal(icon, title, bodyHTML, isCorrect) {
            const modal = document.getElementById('feedback-modal');
            const modalContent = document.getElementById('modal-content');
            const modalBtn = document.getElementById('modal-btn');

            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;

            if (isCorrect) {
                modalContent.className = "bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center animate-pop border-4 border-emerald-400";
                modalBtn.className = "btn-action w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-xl shadow-md border-b-4 border-emerald-700";
                modalBtn.textContent = "다음 문제 도전! 🚀";
            } else {
                modalContent.className = "bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center animate-pop border-4 border-amber-400";
                modalBtn.className = "btn-action w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-black text-lg rounded-xl shadow-md border-b-4 border-amber-700";
                modalBtn.textContent = "다음 문제 풀기 ➡️";
            }

            modal.classList.remove('hidden');
        }

        function closeModalAndNext() {
            if (autoNextTimeout) {
                clearTimeout(autoNextTimeout);
                autoNextTimeout = null;
            }
            const modal = document.getElementById('feedback-modal');
            modal.classList.add('hidden');
            generateNewQuestion();
        }

        // --- Visual Effects (Confetti) ---
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
