<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선시대 역사 연표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6eeeb;--surface:#f8faf8;--ink:#1c2630;--muted:#566670;--line:#b7c6c1;--gold:#9a6f12;--gold2:#c9972b;--seal:#b3261e;--jade:#1f7a68;
  --s1:#1f5f9e;--s2:#b3261e;--s3:#c9972b;--s4:#1f7a68;--s5:#4b3f8f;
  --serif:"Gowun Batang","Batang",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1530;--surface:#18214a;--ink:#f0ead8;--muted:#a9b0cc;--line:#33407a;--gold:#f0c767;--gold2:#e2b650;--seal:#ff7b6b;--jade:#5fd1b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1530;--surface:#18214a;--ink:#f0ead8;--muted:#a9b0cc;--line:#33407a;--gold:#f0c767;--gold2:#e2b650;--seal:#ff7b6b;--jade:#5fd1b5;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--gold2) 18%,transparent),transparent),var(--bg);color:var(--ink);font-family:var(--sans);display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr);overflow:hidden}
.band{height:14px;background:repeating-linear-gradient(90deg,var(--s1) 0 24px,var(--s2) 24px 48px,var(--s3) 48px 72px,var(--s4) 72px 96px,var(--s5) 96px 120px);border-bottom:3px solid var(--gold2);box-shadow:0 2px 0 var(--seal)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px 0;max-width:1240px;width:100%;margin:0 auto}
h1{font-family:var(--serif);font-size:clamp(22px,4vw,34px);margin:0;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--seal));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border-radius:999px;border:2px solid var(--gold2);background:transparent;padding:8px 18px;min-height:40px;font-weight:700;white-space:nowrap}
.btn.fill{background:linear-gradient(135deg,var(--gold2),var(--seal));border-color:transparent;color:#fff}
.btn:hover:not(:disabled){background:var(--gold2);color:#1a1405}
.btn.fill:hover:not(:disabled){filter:brightness(1.1);color:#fff;background:linear-gradient(135deg,var(--gold2),var(--seal))}
button:focus-visible{outline:3px solid var(--seal);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
.wrap{max-width:1240px;width:100%;margin:0 auto;padding:0 20px}
#tl{position:relative;margin-top:12px}
.rail{position:absolute;inset:0;pointer-events:none}
.sg{position:absolute;top:41px;transform:translateY(-50%);border-radius:7px;opacity:.4;transition:opacity .4s}
.sg.past{opacity:1}
.pill{position:absolute;top:41px;transform:translate(-50%,-50%);z-index:2;background:var(--surface);border:1.5px solid var(--gold2);border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px;color:var(--ink);white-space:nowrap}
.nodes{position:relative;display:flex;z-index:1}
.n{flex:1 1 0;min-width:0;background:none;border:0;padding:0 2px;text-align:center}
.yr{display:block;height:30px;line-height:30px;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--muted);transition:color .3s,transform .3s}
.dot{display:block;width:22px;height:22px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--gold2);transition:transform .4s cubic-bezier(.3,1.5,.5,1),background .3s}
.nm{display:block;margin:10px auto 0;font-size:14px;font-weight:500;line-height:1.35;max-width:120px;transition:color .3s}
.n:hover .dot{transform:scale(1.2)}
.n.past .dot{background:var(--gold2)}
.n.on .dot{transform:scale(1.55);background:var(--seal);border-color:var(--seal);box-shadow:0 0 0 6px color-mix(in srgb,var(--seal) 25%,transparent),0 0 18px var(--seal)}
.n.on .yr{color:var(--seal);transform:scale(1.25)}
.n.on .nm{color:var(--seal);font-weight:700}
.rl{margin-top:14px}
.cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px;gap:8px}
.cap b{color:var(--gold)}
.ruler{display:flex;height:32px;border-radius:8px;overflow:hidden;border:2px solid var(--gold2)}
.sr{flex-basis:0;border:0;padding:0;color:#fff;font-size:12px;font-weight:700;opacity:.5;transition:opacity .4s,filter .3s;border-right:1px solid rgba(255,255,255,.5)}
.sr.past{opacity:1}.sr.cur{opacity:1;filter:brightness(1.25) saturate(1.2);box-shadow:inset 0 0 0 3px #fff}
.mw{position:relative;height:14px}
.mk{position:absolute;top:2px;width:0;height:0;border:7px solid transparent;border-bottom:9px solid var(--seal);border-top:0;transform:translateX(-50%);transition:left .6s ease}
#panel{margin:12px auto 14px;background:var(--surface);border:2px solid var(--gold2);border-radius:16px;padding:16px 22px;overflow:auto;min-height:0;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#panel h2{font-family:var(--serif);font-size:26px;margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
#panel h2 small{font-size:18px;color:var(--seal)}
.chip{font-family:var(--sans);font-size:13px;font-weight:700;background:color-mix(in srgb,var(--gold2) 25%,transparent);border-radius:999px;padding:3px 12px;color:var(--ink)}
#panel p{margin:0 0 10px;font-size:16px;line-height:1.75;max-width:75ch}
.notes{margin:0 0 10px;padding:0;list-style:none}
.notes li{display:flex;gap:8px;align-items:flex-start;border-left:4px solid var(--jade);padding:6px 10px;margin-bottom:6px;background:color-mix(in srgb,var(--jade) 12%,transparent);border-radius:0 8px 8px 0;font-size:15px;line-height:1.6}
.notes li span{flex:1;white-space:pre-wrap}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
textarea,input{font:inherit;width:100%;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea:focus,input:focus{outline:3px solid var(--gold2);border-color:var(--gold2)}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
.veil{position:fixed;inset:0;z-index:20;background:rgba(5,8,22,.6);display:none;align-items:center;justify-content:center;padding:14px}
.veil.open{display:flex;animation:fd .25s}
.pop{position:relative;width:min(520px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--surface);border-radius:18px;border:3px solid var(--gold2);border-top:10px solid var(--seal);padding:24px 24px 20px;animation:up .35s cubic-bezier(.3,1.2,.5,1)}
.pop .w{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--seal);margin:0}
.pop h2{font-family:var(--serif);font-size:28px;margin:2px 0 12px}
.pop p{font-size:17px;line-height:1.75;margin:0 0 10px}
.pop .k{background:color-mix(in srgb,var(--jade) 18%,transparent);border-radius:10px;padding:10px 12px;font-weight:500}
.pop .st{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.cl{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:none;font-size:22px}
.err{color:var(--seal);font-size:14px;min-height:20px;margin:6px 0 0}
@keyframes fd{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:640px){
  header p{display:none}.wrap{padding:0 8px}header{padding:8px 10px 0}.btn{padding:6px 12px;min-height:36px;font-size:14px}
  .yr{font-size:10px;letter-spacing:-.5px}.dot{width:14px;height:14px;border-width:3px}.sg{top:41px}
  .nm{font-size:11px;writing-mode:vertical-rl;margin-top:8px;max-height:84px}
  .pill{font-size:10px;padding:0 3px;border-width:1px}.pill i{display:none}
  .n.on .dot{transform:scale(1.5)}.sr{font-size:10px}
  #panel{margin:8px 8px 10px;padding:12px 14px}#panel h2{font-size:21px}#panel p{font-size:15px;line-height:1.65}
  .cap{font-size:11px}
  .veil{align-items:flex-end;padding:0}.pop{border-radius:18px 18px 0 0}
}
</style>
</head>
<body>
<div class="band"></div>
<header>
  <div><h1>조선시대 역사 연표</h1><p>동그라미를 누르면 쉬운 설명이, 아래에는 더 자세한 설명이 나와요.</p></div>
  <button class="btn fill" id="addEv" type="button">+ 사건 추가</button>
</header>
<div class="wrap">
  <div id="tl"><div class="rail" id="rail"></div><div class="nodes" id="nodes"></div></div>
</div>
<div class="wrap rl">
  <div class="cap"><span>시간의 길이 (칸이 넓을수록 오래 걸린 기간)</span><span id="span"></span></div>
  <div class="ruler" id="ruler"></div>
  <div class="mw"><div class="mk" id="mk"></div></div>
</div>
<div class="wrap" style="display:grid;min-height:0"><section id="panel" aria-live="polite"></section></div>

<div class="veil" id="pv"><div class="pop" role="dialog" aria-modal="true" aria-labelledby="pt">
  <button class="cl" id="pc" type="button" aria-label="닫기">×</button>
  <p class="w" id="pw"></p><h2 id="pt"></h2><p id="pb"></p><p class="k" id="pk"></p>
  <div class="st"><button class="btn" id="pp" type="button">이전 사건</button><button class="btn" id="pn" type="button">다음 사건</button></div>
</div></div>

<div class="veil" id="av"><div class="pop" role="dialog" aria-modal="true" aria-labelledby="at">
  <button class="cl" id="ac" type="button" aria-label="닫기">×</button>
  <h2 id="at">새 사건 추가</h2>
  <label for="fy">연도 (예: 1636)</label><input id="fy" type="number" min="1" max="2100">
  <label for="fn">사건 이름</label><input id="fn" maxlength="20">
  <label for="fs">쉬운 설명 (팝업에 나와요)</label><textarea id="fs" rows="2"></textarea>
  <label for="fl">자세한 설명 (아래 패널에 나와요)</label><textarea id="fl" rows="3"></textarea>
  <p class="err" id="fe"></p>
  <div class="st"><button class="btn" id="fc" type="button">취소</button><button class="btn fill" id="fa" type="button">추가하기</button></div>
</div></div>

<script>
var BASE=[
{y:1392,n:"조선 건국",s:"이성계 장군이 고려를 이어 새로운 나라 ‘조선’을 세웠어요. 수도는 한양, 지금의 서울이에요.",k:"새 나라 조선이 시작됐어요.",l:"1392년 이성계가 고려의 마지막 왕을 물러나게 하고 왕위에 올랐어요. 정도전 같은 학자들이 새 나라의 법과 제도를 만드는 데 큰 역할을 했어요. 나라 이름을 ‘조선’으로 정한 뒤 수도를 개경에서 한양으로 옮기고 경복궁을 지었어요. 조선은 유교를 나라의 바탕으로 삼아 500년 넘게 이어졌어요."},
{y:1418,n:"세종대왕 즉위",s:"세종대왕이 조선의 네 번째 임금이 되었어요. 훌륭한 학자들과 함께 백성을 위한 일을 많이 했어요.",k:"백성을 위한 정치가 활짝 열렸어요.",l:"태종이 왕위를 물려주면서 셋째 아들 충녕대군이 세종이 되었어요. 세종은 집현전에서 학자들을 키우고, 농사 책인 『농사직설』을 펴냈어요. 장영실 같은 과학자와 함께 해시계, 물시계, 측우기를 만들었고, 북쪽 국경에는 4군 6진을 두어 나라의 땅을 지켰어요."},
{y:1443,n:"한글 창제",s:"세종대왕이 누구나 쉽게 배울 수 있는 우리 글자를 만들었어요. 1446년에 ‘훈민정음’이라는 이름으로 널리 알렸어요.",k:"우리 글자 한글이 태어났어요.",l:"그때는 한자를 배우기 어려워 글을 모르는 백성이 많았어요. 세종은 1443년에 새 글자를 만들고 1446년 ‘훈민정음’, 곧 ‘백성을 가르치는 바른 소리’라는 이름으로 알렸어요. 자음은 소리 낼 때의 입과 혀 모양을, 모음은 하늘·땅·사람의 모습을 본떠 만들어 배우기 쉬워요."},
{y:1592,n:"임진왜란",s:"일본이 조선에 쳐들어와 전쟁이 일어났어요. 이순신 장군과 의병들이 나라를 지켰어요.",k:"온 나라가 힘을 모아 나라를 지켰어요.",l:"1592년 일본군이 부산으로 쳐들어오면서 전쟁이 시작되었어요. 이순신 장군은 거북선과 뛰어난 작전으로 한산도 대첩 등에서 크게 이겼고, 곽재우 같은 의병장과 백성들도 곳곳에서 싸웠어요. 명나라의 도움도 받았어요. 1597년 다시 전쟁이 벌어졌다가 1598년에 끝났어요. 이 시기 조선은 큰 피해를 입었어요."},
{y:1636,n:"병자호란",s:"청나라가 조선에 쳐들어왔어요. 인조 임금은 남한산성으로 피했지만 결국 항복했어요.",k:"청나라와의 전쟁으로 백성이 힘들었어요.",l:"청나라는 조선에 자기 나라를 섬기라고 요구했어요. 조선이 거절하자 1636년 겨울 청나라 군대가 쳐들어왔어요. 인조는 남한산성에서 40여 일을 버텼지만, 추위와 식량 부족으로 1637년 1월 삼전도에서 항복했어요. 많은 백성이 포로로 끌려가는 아픔을 겪었어요."},
{y:1724,n:"영조의 탕평책",s:"영조 임금은 편을 가르지 않고 능력 있는 사람을 고르게 뽑으려고 했어요.",k:"편 가르지 말고 고르게 사람을 뽑았어요.",l:"그 무렵 신하들은 붕당으로 나뉘어 자주 다투었어요. 1724년 왕이 된 영조는 이를 막으려고 여러 붕당의 인재를 고르게 쓰는 ‘탕평책’을 펼쳤어요. 성균관 앞에 탕평비를 세우고, 균역법으로 백성의 군역 부담도 줄여 주었어요."},
{y:1794,n:"수원 화성 축조",s:"정조 임금이 수원에 튼튼하고 아름다운 성을 짓기 시작했어요. 1796년에 완성되었어요.",k:"과학의 힘으로 멋진 성을 지었어요.",l:"정조는 아버지 사도세자의 무덤을 수원으로 옮기고, 그 주변에 새 도시와 성을 만들기로 했어요. 정약용이 설계를 도왔고, 거중기와 같은 기계로 무거운 돌을 쉽게 옮겼어요. 공사 과정은 『화성성역의궤』라는 책에 자세히 기록되어 있어요. 화성은 1997년 유네스코 세계유산이 되었어요."},
{y:1866,n:"병인양요",s:"프랑스 군대가 강화도에 쳐들어왔어요. 우리 군사들이 용감하게 싸워 물리쳤어요.",k:"외국 군대가 쳐들어왔지만 막아 냈어요.",l:"1866년 조선이 천주교를 탄압하는 과정에서 프랑스 신부들이 죽자, 프랑스 군대가 강화도에 쳐들어왔어요. 양헌수 장군의 부대가 정족산성에서 프랑스군을 물리쳤어요. 물러가던 프랑스군은 강화도 외규장각의 귀한 책들을 가져갔고, 그 일부는 2011년에 돌아왔어요."},
{y:1894,n:"동학농민운동",s:"관리들이 세금을 지나치게 걷자 전봉준을 중심으로 농민들이 들고일어났어요.",k:"농민들이 더 나은 세상을 외쳤어요.",l:"전라도 고부에서 관리의 횡포에 맞서 농민들이 일어났고, 전봉준이 이끄는 동학 농민군은 전주성까지 차지했어요. 농민군은 잘못된 나라의 정치를 고치라고 요구했어요. 그런데 일본군과 청나라 군대가 들어오면서 청일전쟁이 일어났고, 농민군은 우금치 전투에서 패배했어요."},
{y:1897,n:"대한제국 선포",s:"고종 임금이 나라 이름을 ‘대한제국’으로 바꾸고 스스로 황제가 되었어요.",k:"스스로 나라를 지키겠다는 선언이었어요.",l:"고종은 1897년 환구단에서 하늘에 제사를 지낸 뒤 황제가 되었고, 연호를 ‘광무’라 했어요. 다른 나라에 휘둘리지 않는 자주 독립 국가가 되겠다는 뜻이었어요. 하지만 일본의 간섭이 심해져 1910년 대한제국은 나라의 주권을 잃고 말았어요."}
];
BASE.forEach(function(e,i){e.id="b"+i});
var KEY="joseon-timeline-v2",custom=[],notes={},EV=[],cur="b0",delArm=false,noteOpen=false;
var COL=["--s1","--s2","--s3","--s4","--s5"];
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv){custom=sv.custom||[];notes=sv.notes||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({custom:custom,notes:notes}))}catch(e){}}
function $(id){return document.getElementById(id)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function idx(){for(var i=0;i<EV.length;i++)if(EV[i].id===cur)return i;return 0}

function render(){
  EV=BASE.concat(custom).map(function(e,i){e.o=i;return e}).sort(function(a,b){return a.y-b.y||a.o-b.o});
  var N=EV.length,rail=$("rail"),nodes=$("nodes"),ru=$("ruler");
  rail.innerHTML="";nodes.innerHTML="";ru.innerHTML="";
  EV.forEach(function(e,i){
    var b=el("button","n");b.type="button";b.setAttribute("aria-label",e.y+"년 "+e.n);
    b.appendChild(el("span","yr",e.y));b.appendChild(el("span","dot"));b.appendChild(el("span","nm",e.n));
    b.onclick=function(){select(e.id,true)};nodes.appendChild(b);
    if(i<N-1){
      var g=EV[i+1].y-e.y,c="var("+COL[i%5]+")";
      var s=el("div","sg");s.style.cssText="left:"+((i+.5)/N*100)+"%;width:"+(100/N)+"%;height:"+(5+Math.round(Math.sqrt(g)*.9))+"px;background:"+c;rail.appendChild(s);
      var p=el("div","pill");p.style.left=((i+1)/N*100)+"%";
      if(g===0)p.textContent="같은 해";else{p.appendChild(document.createTextNode(g));p.appendChild(el("i",null,"년"))}
      rail.appendChild(p);
      var r=el("button","sr");r.type="button";r.style.cssText="flex-grow:"+Math.max(g,.3)+";background:"+c;
      r.title=e.y+"년 → "+EV[i+1].y+"년: "+g+"년";r.appendChild(el("span",null,g+"년"));
      r.onclick=function(){select(e.id,false)};ru.appendChild(r);
    }
  });
  var sp=EV[N-1].y-EV[0].y;
  $("span").innerHTML="";$("span").appendChild(document.createTextNode(EV[0].y+"년 ~ "+EV[N-1].y+"년, 모두 "));
  $("span").appendChild(el("b",null,sp+"년"));
  select(cur,false);
  requestAnimationFrame(fit);
}
function fit(){
  var s=document.querySelectorAll(".sr");
  for(var i=0;i<s.length;i++){var t=s[i].firstChild;t.style.display="";if(s[i].offsetWidth<t.offsetWidth+8)t.style.display="none"}
}
window.addEventListener("resize",fit);

function select(id,pop){
  var found=EV.some(function(e){return e.id===id});if(!found)id=EV[0].id;
  cur=id;var i=idx(),e=EV[i],N=EV.length;delArm=false;
  [].forEach.call($("nodes").children,function(n,k){n.classList.toggle("on",k===i);n.classList.toggle("past",k<i)});
  [].forEach.call($("rail").querySelectorAll(".sg"),function(s,k){s.classList.toggle("past",k<i)});
  [].forEach.call($("ruler").children,function(s,k){s.classList.toggle("past",k<i);s.classList.toggle("cur",k===i)});
  var sp=Math.max(EV[N-1].y-EV[0].y,1);$("mk").style.left=((e.y-EV[0].y)/sp*100)+"%";
  $("pw").textContent=e.y+"년";$("pt").textContent=e.n;$("pb").textContent=e.s||e.l||"";
  $("pk").textContent=e.k?"한 줄 정리: "+e.k:"";$("pk").style.display=e.k?"":"none";
  $("pp").disabled=i===0;$("pn").disabled=i===N-1;
  panel();if(pop)$("pv").classList.add("open");
}
function panel(){
  var i=idx(),e=EV[i],P=$("panel");P.innerHTML="";
  var h=el("h2",null,e.n),sm=el("small",null,e.y+"년");h.appendChild(sm);
  var nx=EV[i+1],pv=EV[i-1];
  if(nx)h.appendChild(el("span","chip","다음 사건까지 "+(nx.y-e.y)+"년"));
  if(pv)h.appendChild(el("span","chip","앞 사건에서 "+(e.y-pv.y)+"년 뒤"));
  if(!pv)h.appendChild(el("span","chip","연표의 시작"));
  P.appendChild(h);
  P.appendChild(el("p",null,e.l||e.s||"아직 자세한 설명이 없어요. ‘설명 추가’ 버튼으로 직접 적어 보세요."));
  var ns=notes[e.id]||[];
  if(ns.length){var ul=el("ul","notes");ns.forEach(function(t,k){var li=el("li");li.appendChild(el("span",null,t));
    var x=el("button","x","×");x.type="button";x.setAttribute("aria-label","추가 설명 삭제");x.onclick=function(){ns.splice(k,1);if(!ns.length)delete notes[e.id];save();panel()};li.appendChild(x);ul.appendChild(li)});P.appendChild(ul)}
  var a=el("div","acts");
  if(noteOpen){
    var w=el("div");w.style.width="100%";var ta=el("textarea");ta.rows=3;ta.placeholder="이 사건에 대해 더 알려 주고 싶은 내용을 적어 보세요.";ta.setAttribute("aria-label","추가할 설명");
    var sb=el("button","btn fill","저장");sb.type="button";var cb=el("button","btn","취소");cb.type="button";
    sb.onclick=function(){var t=ta.value.trim();if(!t){ta.focus();return}(notes[e.id]=notes[e.id]||[]).push(t);noteOpen=false;save();panel()};
    cb.onclick=function(){noteOpen=false;panel()};
    w.appendChild(ta);a.appendChild(w);a.appendChild(sb);a.appendChild(cb);P.appendChild(a);ta.focus();
  }else{
    var nb=el("button","btn","+ 설명 추가");nb.type="button";nb.onclick=function(){noteOpen=true;panel()};a.appendChild(nb);
    if(e.id[0]==="c"){var db=el("button","btn",delArm?"정말 삭제할까요?":"사건 삭제");db.type="button";
      db.onclick=function(){if(!delArm){delArm=true;panel();return}
        custom=custom.filter(function(c){return c.id!==e.id});delete notes[e.id];save();cur=(EV[i-1]||EV[i+1]||EV[0]).id;render()};a.appendChild(db)}
    P.appendChild(a);
  }
}
function go(d){var j=idx()+d;if(j>=0&&j<EV.length){noteOpen=false;select(EV[j].id,$("pv").classList.contains("open"))}}
$("pp").onclick=function(){go(-1)};$("pn").onclick=function(){go(1)};
function cl(v){v.classList.remove("open")}
$("pc").onclick=function(){cl($("pv"))};
[$("pv"),$("av")].forEach(function(v){v.addEventListener("click",function(ev){if(ev.target===v)cl(v)})});
$("addEv").onclick=function(){["fy","fn","fs","fl"].forEach(function(f){$(f).value=""});$("fe").textContent="";$("av").classList.add("open");$("fy").focus()};
$("ac").onclick=$("fc").onclick=function(){cl($("av"))};
$("fa").onclick=function(){
  var y=parseInt($("fy").value,10),n=$("fn").value.trim();
  if(!(y>=1&&y<=2100)){$("fe").textContent="연도를 1~2100 사이 숫자로 적어 주세요.";$("fy").focus();return}
  if(!n){$("fe").textContent="사건 이름을 적어 주세요.";$("fn").focus();return}
  var c={id:"c"+Date.now(),y:y,n:n,s:$("fs").value.trim(),l:$("fl").value.trim(),k:""};
  custom.push(c);save();cl($("av"));noteOpen=false;cur=c.id;render();
};
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){cl($("pv"));cl($("av"));return}
  var t=ev.target.tagName;if(t==="TEXTAREA"||t==="INPUT"||$("av").classList.contains("open"))return;
  if(ev.key==="ArrowRight")go(1);else if(ev.key==="ArrowLeft")go(-1);
});
render();
</script>
</body>
</html>
