<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#1A2233; --muted:#667085; --line:#D9DFE8;
  --study:#2547D0; --study-bg:#E3E9FC; --life:#0C8A6A; --life-bg:#DDF3EC;
  --doing:#E8A200; --doing-bg:#FFF2CC; --danger:#C2362B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1B2232; --ink:#EAEEF6; --muted:#98A2B6; --line:#2E3750;
    --study:#8EA6FF; --study-bg:#252F56; --life:#5FD3AF; --life-bg:#1B3A32;
    --doing:#F5BE3A; --doing-bg:#3D3216; --danger:#FF8A80;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 56px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--study);outline-offset:2px}

header h1{font-size:1.5rem;margin:0 0 4px;font-weight:700}
header p{margin:0;color:var(--muted);font-size:.9rem}

.datebar{display:flex;align-items:center;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.datebar .nav{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.1rem}
.datebar input[type=date]{height:40px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.datebar .today{height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:500}
.datebar .label{margin-left:auto;font-weight:700}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--ink);color:var(--bg);border-radius:16px;overflow:hidden}
.summary div{padding:16px 18px}
.summary div+div{border-left:1px solid rgba(255,255,255,.18)}
.summary b{display:block;font-size:2.4rem;line-height:1.1;font-weight:700}
.summary span{font-size:.85rem;opacity:.8}
.bar{height:8px;background:var(--line);border-radius:99px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--life);transition:width .3s}
.pct{font-size:.85rem;color:var(--muted);margin:0 0 20px}

form.add{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
form.add input[type=text]{flex:1 1 200px;height:42px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 12px}
select{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}
.btn{height:42px;padding:0 18px;border:0;border-radius:10px;background:var(--study);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#10162A}}

.filters{display:flex;gap:6px;margin:18px 0 6px}
.filters button{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

h2{font-size:1.05rem;margin:24px 0 8px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:.8rem;font-weight:500;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--study);border-radius:12px;padding:10px 12px}
li.item.life{border-left-color:var(--life)}
li.item.doing{background:linear-gradient(0deg,var(--doing-bg),var(--doing-bg)) ,var(--surface)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;font-size:.9rem;line-height:1}
.done .chk{background:var(--life);border-color:var(--life);color:#fff}
.body{flex:1;min-width:0}
.title{word-break:break-word}
.done .title{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;margin-top:2px;font-weight:500}
.tag.study{background:var(--study-bg);color:var(--study)}
.tag.life{background:var(--life-bg);color:var(--life)}
.tag.doing{background:var(--doing-bg);color:var(--ink);margin-left:4px}
.acts{display:flex;gap:4px;flex:none}
.acts button{min-width:36px;height:34px;border:1px solid var(--line);background:transparent;border-radius:8px;font-size:.8rem;padding:0 8px}
.acts .del{color:var(--danger)}
.edit{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.edit input{flex:1 1 140px;height:36px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:0 10px}
.edit select{height:36px}
.empty{color:var(--muted);font-size:.9rem;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
@media (max-width:480px){
  li.item{flex-wrap:wrap}
  .acts{width:100%;justify-content:flex-end}
  .summary b{font-size:1.9rem}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>오늘의 할 일</h1>
    <p>해야 할 일을 적고, 끝난 일과 남은 일을 한눈에 확인하세요.</p>
  </header>

  <div class="datebar">
    <button class="nav" id="prev" aria-label="전날">‹</button>
    <input type="date" id="date" aria-label="날짜 선택">
    <button class="nav" id="next" aria-label="다음날">›</button>
    <button class="today" id="today">오늘</button>
    <span class="label" id="dlabel"></span>
  </div>

  <section class="summary" aria-label="요약">
    <div><b id="cTotal">0</b><span>전체</span></div>
    <div><b id="cDone">0</b><span>완료</span></div>
    <div><b id="cLeft">0</b><span>남은 일</span></div>
  </section>
  <div class="bar"><i id="barFill"></i></div>
  <p class="pct" id="pct">아직 등록된 할 일이 없어요.</p>

  <form class="add" id="addForm">
    <input type="text" id="newText" placeholder="할 일을 입력하세요" maxlength="100" aria-label="할 일" required>
    <select id="newCat" aria-label="카테고리">
      <option value="study">학업</option>
      <option value="life">일상</option>
    </select>
    <button class="btn" type="submit">추가</button>
  </form>

  <div class="filters" role="group" aria-label="카테고리 보기">
    <button data-f="all" aria-pressed="true">전체</button>
    <button data-f="study" aria-pressed="false">학업</button>
    <button data-f="life" aria-pressed="false">일상</button>
  </div>

  <h2>진행 목록 <span class="n" id="nActive"></span></h2>
  <ul id="active"></ul>

  <h2>완료 목록 <span class="n" id="nDone"></span></h2>
  <ul id="completed"></ul>
</div>

<script>
(function(){
  var KEY = 'today-todo-v1';
  var CAT = { study: '학업', life: '일상' };
  var data = {};            // { 'YYYY-MM-DD': [ {id,text,cat,status} ] }  status: todo | doing | done
  var filter = 'all';
  var editingId = null;

  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function fmt(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  var cur = fmt(new Date());

  var $ = function(id){ return document.getElementById(id); };
  var dateEl = $('date');

  function list(){ return data[cur] || (data[cur] = []); }

  function setDate(s){
    if (!s) return;
    cur = s; editingId = null; render();
  }
  function shift(n){ var d = parse(cur); d.setDate(d.getDate() + n); setDate(fmt(d)); }

  function row(t){
    var li = document.createElement('li');
    li.className = 'item ' + t.cat + (t.status === 'doing' ? ' doing' : '') + (t.status === 'done' ? ' done' : '');

    var chk = document.createElement('button');
    chk.className = 'chk'; chk.type = 'button';
    chk.setAttribute('aria-label', t.status === 'done' ? '완료 취소' : '완료로 표시');
    chk.textContent = t.status === 'done' ? '✓' : '';
    chk.onclick = function(){ t.status = t.status === 'done' ? 'todo' : 'done'; save(); render(); };
    li.appendChild(chk);

    if (editingId === t.id){
      var f = document.createElement('div'); f.className = 'edit';
      var inp = document.createElement('input'); inp.type = 'text'; inp.value = t.text; inp.maxLength = 100; inp.setAttribute('aria-label','할 일 수정');
      var sel = document.createElement('select'); sel.setAttribute('aria-label','카테고리');
      Object.keys(CAT).forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = CAT[k]; if (k === t.cat) o.selected = true; sel.appendChild(o); });
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn'; ok.style.height = '36px'; ok.textContent = '저장';
      var no = document.createElement('button'); no.type = 'button'; no.textContent = '취소';
      no.style.cssText = 'height:36px;padding:0 12px;border:1px solid var(--line);background:transparent;border-radius:8px';
      var commit = function(){ var v = inp.value.trim(); if (!v) { inp.focus(); return; } t.text = v; t.cat = sel.value; editingId = null; save(); render(); };
      ok.onclick = commit; no.onclick = function(){ editingId = null; render(); };
      inp.onkeydown = function(e){ if (e.key === 'Enter') commit(); if (e.key === 'Escape') { editingId = null; render(); } };
      f.appendChild(inp); f.appendChild(sel); f.appendChild(ok); f.appendChild(no);
      li.appendChild(f);
      setTimeout(function(){ inp.focus(); }, 0);
      return li;
    }

    var body = document.createElement('div'); body.className = 'body';
    var title = document.createElement('div'); title.className = 'title'; title.textContent = t.text;
    var tag = document.createElement('span'); tag.className = 'tag ' + t.cat; tag.textContent = CAT[t.cat];
    body.appendChild(title); body.appendChild(tag);
    if (t.status === 'doing'){ var d = document.createElement('span'); d.className = 'tag doing'; d.textContent = '진행 중'; body.appendChild(d); }
    li.appendChild(body);

    var acts = document.createElement('div'); acts.className = 'acts';
    if (t.status !== 'done'){
      var go = document.createElement('button'); go.type = 'button';
      go.textContent = t.status === 'doing' ? '대기로' : '시작';
      go.onclick = function(){ t.status = t.status === 'doing' ? 'todo' : 'doing'; save(); render(); };
      acts.appendChild(go);
    }
    var ed = document.createElement('button'); ed.type = 'button'; ed.textContent = '수정';
    ed.onclick = function(){ editingId = t.id; render(); };
    var del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '삭제';
    del.onclick = function(){
      if (!confirm('"' + t.text + '"을(를) 삭제할까요?')) return;
      data[cur] = list().filter(function(x){ return x.id !== t.id; }); save(); render();
    };
    acts.appendChild(ed); acts.appendChild(del);
    li.appendChild(acts);
    return li;
  }

  function fill(ul, items, msg){
    ul.innerHTML = '';
    if (!items.length){ var e = document.createElement('li'); e.className = 'empty'; e.textContent = msg; ul.appendChild(e); return; }
    items.forEach(function(t){ ul.appendChild(row(t)); });
  }

  function render(){
    dateEl.value = cur;
    var d = parse(cur), wk = ['일','월','화','수','목','금','토'][d.getDay()];
    $('dlabel').textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + wk + ')' + (cur === fmt(new Date()) ? ' · 오늘' : '');

    var all = list();
    var total = all.length, done = all.filter(function(t){ return t.status === 'done'; }).length, left = total - done;
    $('cTotal').textContent = total; $('cDone').textContent = done; $('cLeft').textContent = left;
    var pct = total ? Math.round(done / total * 100) : 0;
    $('barFill').style.width = pct + '%';
    $('pct').textContent = total ? (left === 0 ? '모두 끝냈어요! (' + pct + '%)' : '달성률 ' + pct + '% · ' + left + '개 남았어요') : '아직 등록된 할 일이 없어요.';

    var shown = all.filter(function(t){ return filter === 'all' || t.cat === filter; });
    var active = shown.filter(function(t){ return t.status !== 'done'; })
      .sort(function(a,b){ return (a.status === 'doing' ? 0 : 1) - (b.status === 'doing' ? 0 : 1); });
    var comp = shown.filter(function(t){ return t.status === 'done'; });
    $('nActive').textContent = active.length + '개';
    $('nDone').textContent = comp.length + '개';
    fill($('active'), active, total ? '진행할 일이 없어요.' : '위에서 할 일을 추가해 보세요.');
    fill($('completed'), comp, '아직 완료한 일이 없어요.');

    document.querySelectorAll('.filters button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.f === filter ? 'true' : 'false'); });
  }

  $('addForm').onsubmit = function(e){
    e.preventDefault();
    var v = $('newText').value.trim();
    if (!v) return;
    list().push({ id: Date.now() + '' + Math.floor(Math.random()*1000), text: v, cat: $('newCat').value, status: 'todo' });
    $('newText').value = ''; save(); render(); $('newText').focus();
  };
  $('prev').onclick = function(){ shift(-1); };
  $('next').onclick = function(){ shift(1); };
  $('today').onclick = function(){ setDate(fmt(new Date())); };
  dateEl.onchange = function(){ setDate(dateEl.value); };
  document.querySelectorAll('.filters button').forEach(function(b){ b.onclick = function(){ filter = b.dataset.f; render(); }; });

  render();
})();
</script>
</body>
</html>
