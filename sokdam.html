<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>속담 이어서 말하기 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#3b2f1e;--sub:#7a6a52;--pri:#ff8a3d;--pri2:#e8701f;--ok:#2fa84f;--bad:#e5484d;--line:#f1dfb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a2319;--ink:#fbf1dc;--sub:#c2b394;--line:#4a3d28}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#2a2319;--ink:#fbf1dc;--sub:#c2b394;--line:#4a3d28}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:640px}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 6px 0 var(--line)}
h1{font-size:clamp(28px,7vw,40px);margin:0 0 8px;text-align:center}
p.d{text-align:center;color:var(--sub);font-size:18px;line-height:1.6;margin:0 0 20px}
.emoji{font-size:56px;text-align:center}
label{display:block;font-size:20px;margin:16px 0 8px;text-align:center}
#tv{color:var(--pri2);font-size:32px}
input[type=range]{width:100%;accent-color:var(--pri);height:32px}
.rl{display:flex;justify-content:space-between;color:var(--sub)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 22px;font-size:20px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri2);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
button:disabled{opacity:.45;cursor:not-allowed}
button.g{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.big{width:100%;margin-top:20px;font-size:26px;padding:18px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.st{flex:1;background:var(--card);border:3px solid var(--line);border-radius:18px;text-align:center;padding:8px;font-size:15px;color:var(--sub)}
.st b{display:block;font-size:30px;color:var(--ink)}
.st.low b{color:var(--bad);animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.15)}}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri);width:100%;transition:width .25s linear}
.q{font-size:clamp(32px,9vw,50px);text-align:center;margin:18px 0 8px;line-height:1.35;word-break:keep-all}
.q span{color:var(--pri2);border-bottom:4px dashed var(--pri)}
.hint{min-height:44px;text-align:center;font-size:30px;letter-spacing:4px;color:var(--pri2);margin:6px 0 10px;word-break:keep-all}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:0;font:inherit;font-size:24px;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.row input:focus{outline:none;border-color:var(--pri)}
.fb{min-height:60px;text-align:center;font-size:20px;margin-top:14px;line-height:1.5}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.shake{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big2{font-size:64px;text-align:center;color:var(--pri2);margin:4px 0}
ul{padding:0;list-style:none;margin:10px 0 0;max-height:240px;overflow-y:auto}
li{background:var(--bg);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:18px;word-break:keep-all}
li b{color:var(--pri2)}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:9}
.hide{display:none}
.mean{text-align:center;font-size:20px;color:var(--sub);margin:4px 0 10px;line-height:1.5}li small{display:block;color:var(--sub);font-size:15px;margin-top:2px}.fb small{color:var(--sub);font-size:17px}
</style></head><body>
<canvas id="cv"></canvas>
<div class="wrap">
<section id="s1" class="card">
 <div class="emoji">📜🎈</div>
 <h1>속담 이어서 말하기</h1>
 <p class="d">앞부분을 보고 뒷부분을 완성해요!<br>시간 안에 많이 맞혀 보세요. 초성 힌트는 2번까지!</p>
 <label for="tm">⏰ 제한시간 <span id="tv">90</span>초</label>
 <input type="range" id="tm" min="30" max="300" step="10" value="90">
 <div class="rl"><span>30초</span><span>300초</span></div>
 <button class="big" id="go">🚀 게임 시작</button>
 <p class="d" style="margin:14px 0 0;font-size:14px">문제 <span id="cnt"></span>개 <span id="srcl">(기본 속담)</span> <button class="g" id="rs" style="display:none;padding:4px 10px;font-size:13px">기본 속담으로</button> · 선생님 CSV 불러오기(3열은 뜻 힌트): <input type="file" id="fi" accept=".csv" style="font-size:13px"></p>
</section>
<section id="s2" class="hide">
 <div style="margin-bottom:10px"><button class="g" id="home" style="padding:8px 16px;font-size:16px">🏠 처음으로</button></div>
 <div class="stats"><div class="st">⭐ 점수<b id="sc">0</b></div><div class="st" id="tbox">⏰ 남은 시간<b id="tl">0</b></div></div>
 <div class="bar"><i id="bar"></i></div>
 <div class="card" id="qc">
  <div class="q"><span id="qs"></span> …</div>
  <div class="hint" id="hint">&nbsp;</div><div class="mean" id="mean"></div>
  <div class="row"><input type="text" id="ans" placeholder="뒷부분을 써 보세요" autocomplete="off"><button id="ok">확인</button></div>
  <div class="row" style="margin-top:12px;justify-content:center">
   <button class="g" id="hb">💡 초성 힌트 (2번 남음)</button><button class="g" id="mb">🧩 뜻 힌트</button><button class="g" id="skip">🤔 모르겠어요</button>
  </div>
  <div class="fb" id="fb"></div>
 </div>
</section>
<section id="s3" class="card hide">
 <div class="emoji">🏆</div><h1>게임 끝!</h1>
 <div class="big2" id="rc">0</div>
 <p class="d" id="rd"></p>
 <div id="wr"></div>
 <div class="row" style="margin-top:20px"><button class="big" id="again" style="flex:1;margin:0">🔁 다시 하기</button><button class="big g" id="home2" style="flex:1;margin:0">🏠 처음으로</button></div>
</section>
</div>
<script>
const BASE=[["가는 말이", "고와야 오는 말이 곱다", "말을 곱게 하면 남도 나에게 곱게 말해 준다는 뜻이에요."], ["가는 날이", "장날이다", "어떤 일을 하려는데 우연히 다른 일과 겹쳤을 때 쓰는 말이에요."], ["고래 싸움에", "새우 등 터진다", "힘센 사람들끼리 싸우는 바람에 약한 사람이 피해를 본다는 뜻이에요."], ["공든 탑이", "무너지랴", "정성을 다해 쌓은 일은 쉽게 무너지지 않는다는 뜻이에요."], ["구슬이 서 말이라도", "꿰어야 보배", "아무리 좋은 재료가 많아도 잘 엮어서 쓸모 있게 만들어야 가치가 있다는 뜻이에요."], ["그림의", "떡", "좋아 보여도 가질 수 없거나 쓸 수 없는 것을 말해요."], ["꿩 대신", "닭", "꼭 맞는 것이 없을 때 비슷한 것으로 대신한다는 뜻이에요."], ["낮말은", "새가 듣고 밤말은 쥐가 듣는다", "아무도 없는 줄 알고 한 말도 누군가 들을 수 있으니 말조심하라는 뜻이에요."], ["누워서", "침 뱉기", "남을 흉보거나 해치려다가 오히려 내가 피해를 본다는 뜻이에요."], ["닭 쫓던 개", "지붕 쳐다보듯", "애써 쫓던 것을 놓쳐서 멍하니 바라볼 수밖에 없다는 뜻이에요."], ["돌다리도", "두들겨 보고 건너라", "잘 아는 일이라도 조심해서 살피고 확인하라는 뜻이에요."], ["등잔 밑이", "어둡다", "가까이 있는 것을 오히려 잘 알아차리지 못한다는 뜻이에요."], ["말 한마디에", "천 냥 빚도 갚는다", "말을 잘하면 어려운 일도 풀 수 있다는 뜻이에요."], ["믿는 도끼에", "발등 찍힌다", "믿었던 사람에게 배신당해 피해를 본다는 뜻이에요."], ["바늘 도둑이", "소 도둑 된다", "작은 나쁜 짓도 버릇이 되면 큰 나쁜 짓을 하게 된다는 뜻이에요."], ["발 없는 말이", "천 리 간다", "말은 순식간에 멀리 퍼지니 말조심하라는 뜻이에요."], ["백지장도", "맞들면 낫다", "쉬운 일이라도 함께하면 더 쉬워진다는 뜻이에요."], ["보기 좋은 떡이", "먹기도 좋다", "겉모습이 좋은 것은 내용도 좋다는 뜻이에요."], ["빈 수레가", "요란하다", "아는 것이 적은 사람이 더 잘난 척하며 시끄럽게 군다는 뜻이에요."], ["사공이 많으면", "배가 산으로 간다", "여러 사람이 서로 자기 말만 하면 일이 엉뚱하게 된다는 뜻이에요."], ["세 살 버릇", "여든까지 간다", "어릴 때 몸에 밴 버릇은 늙어서도 고치기 어렵다는 뜻이에요."], ["소 잃고", "외양간 고친다", "일이 잘못된 뒤에야 뒤늦게 대비한다는 뜻이에요."], ["쇠뿔도", "단김에 빼라", "하려는 일은 생각났을 때 바로 해야 한다는 뜻이에요."], ["아는 길도", "물어 가라", "잘 아는 일이라도 한 번 더 확인하고 조심하라는 뜻이에요."], ["아니 땐 굴뚝에", "연기 날까", "원인이 없으면 결과도 생기지 않는다는 뜻이에요."], ["우물 안", "개구리", "넓은 세상을 모르고 자기가 아는 것만 전부라고 생각하는 사람을 말해요."], ["원숭이도", "나무에서 떨어진다", "아무리 잘하는 사람도 가끔 실수할 수 있다는 뜻이에요."], ["윗물이", "맑아야 아랫물이 맑다", "윗사람이 잘해야 아랫사람도 따라서 잘한다는 뜻이에요."], ["작은 고추가", "맵다", "몸집이 작아도 속이 단단하고 능력이 뛰어나다는 뜻이에요."], ["종로에서 뺨 맞고", "한강에서 눈 흘긴다", "엉뚱한 곳에서 화풀이를 한다는 뜻이에요."], ["천 리 길도", "한 걸음부터", "아무리 큰 일도 첫걸음부터 시작된다는 뜻이에요."], ["티끌 모아", "태산", "작은 것도 모으면 큰 것이 된다는 뜻이에요."], ["하늘의", "별 따기", "아주 어렵고 불가능해 보이는 일을 말해요."], ["호랑이도 제 말 하면", "온다", "다른 사람 이야기를 하는데 마침 그 사람이 나타났을 때 쓰는 말이에요."], ["호미로 막을 것을", "가래로 막는다", "작은 일을 일찍 하지 않아 나중에 큰 일이 된다는 뜻이에요."], ["하나를 보면", "열을 안다", "한 가지만 봐도 나머지를 짐작할 만큼 똑똑하다는 뜻이에요."], ["콩 심은 데", "콩 나고 팥 심은 데 팥 난다", "어떤 일이든 원인에 맞는 결과가 나온다는 뜻이에요."], ["열 길 물속은 알아도", "한 길 사람 속은 모른다", "사람의 마음은 알기 어렵다는 뜻이에요."], ["금강산도", "식후경", "아무리 좋은 일도 배가 불러야 즐길 수 있다는 뜻이에요."], ["개구리 올챙이 적", "생각 못 한다", "형편이 나아진 뒤 어려웠던 때를 잊고 잘난 척한다는 뜻이에요."], ["가재는", "게 편이다", "처지가 비슷한 사람끼리 서로 편들어 준다는 뜻이에요."], ["백 번 듣는 것이", "한 번 보는 것만 못하다", "직접 눈으로 보는 것이 가장 정확하다는 뜻이에요."], ["겉 다르고", "속 다르다", "겉으로 하는 말과 속마음이 다르다는 뜻이에요."], ["고생 끝에", "낙이 온다", "힘든 일을 참고 견디면 즐거운 일이 온다는 뜻이에요."], ["귀에 걸면 귀걸이", "코에 걸면 코걸이", "한 가지 일을 이렇게도 저렇게도 해석할 수 있다는 뜻이에요."], ["남의 떡이", "더 커 보인다", "남의 것이 내 것보다 더 좋아 보인다는 뜻이에요."], ["누이 좋고", "매부 좋다", "서로에게 모두 이익이 되는 일을 말해요."], ["똥 묻은 개가", "겨 묻은 개 나무란다", "자기 흉은 모르고 남의 흉만 본다는 뜻이에요."], ["싼 게", "비지떡", "값이 싼 물건은 품질도 좋지 않다는 뜻이에요."], ["웃는 얼굴에", "침 못 뱉는다", "웃으며 대하는 사람에게는 모질게 대할 수 없다는 뜻이에요."]];
let DATA=BASE;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho=s=>[...s].map(c=>{const n=c.charCodeAt(0)-44032;return n>=0&&n<11172?CHO[Math.floor(n/588)]:c}).join("");
const END=/(입니다|이에요|이예요|이네요|이군요|이라네|이다|이야|이지|이죠|이네|예요|에요|어요|아요|네요|군요|습니다|다|요|네|지|죠|야)$/;
const PART=/[이가은는을를도만에의로와과]/g;
function key(s){let k=s.replace(/[\s.,!?~'"’“”]/g,"").replace(END,"");return k.replace(PART,"")||k}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function same(u,a){const x=key(u),y=key(a);if(!x)return false;if(x===y)return true;const A=x.normalize("NFD"),B=y.normalize("NFD"),L=B.length;return lev(A,B)<=(L<8?0:Math.round(L*.15))}
let q=[],qi=0,score=0,tl=0,total=0,timer=null,hints=0,mUsed=false,tries=0,rev=new Map(),right=[],miss=[],locked=false,cur=null,gid=0;
const add=(p,why)=>{if(!rev.has(p[0]))rev.set(p[0],{p,why})};
function setData(D,c){DATA=D;$("cnt").textContent=D.length;$("srcl").textContent=c?"(선생님 문제)":"(기본 속담)";$("rs").style.display=c?"":"none"}
setData(BASE,false);$("rs").onclick=()=>{setData(BASE,false);$("fi").value=""};
$("tm").oninput=e=>$("tv").textContent=e.target.value;
function show(id){["s1","s2","s3"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function parseCSV(t){const R=[];let r=[],f="",o=false;for(let i=0;i<t.length;i++){const c=t[i];if(o){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else o=false}else f+=c}else if(c=='"')o=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);R.push(r);r=[];f=""}else f+=c}r.push(f);R.push(r);return R}
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(b=>{let t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(_){t=new TextDecoder("euc-kr").decode(b)}
 let R=parseCSV(t.replace(/^\uFEFF/,"")).map(x=>x.map(y=>y.trim())).filter(x=>x[0]&&x[1]);if(R.length&&/앞/.test(R[0][0]))R.shift();
 if(R.length)setData(R,true);else{setData(BASE,false);$("srcl").textContent="(CSV를 읽지 못해 기본 속담 사용)"}})};
$("go").onclick=()=>{if(!DATA.length)setData(BASE,false);gid++;total=+$("tm").value;tl=total;score=0;rev=new Map();right=[];miss=[];q=shuf(DATA);qi=0;$("sc").textContent=0;show("s2");next();tick();clearInterval(timer);timer=setInterval(tick,1000)};
function home(){gid++;clearInterval(timer);ps=[];show("s1")}
$("home").onclick=home;$("home2").onclick=home;
function tick(){$("tl").textContent=tl+"초";$("bar").style.width=(tl/total*100)+"%";$("tbox").classList.toggle("low",tl<=10);if(tl<=0){end();return}tl--}
function next(){if(qi>=q.length){q=shuf(DATA);qi=0}cur=q[qi++];hints=0;mUsed=false;tries=0;locked=false;$("qs").textContent=cur[0];$("hint").innerHTML="&nbsp;";$("mean").textContent="";$("ans").value="";$("ans").disabled=false;$("fb").textContent="";$("fb").className="fb";$("hb").disabled=false;$("hb").textContent="💡 초성 힌트 (2번 남음)";$("mb").style.display=cur[2]?"":"none";$("mb").disabled=false;$("ok").disabled=false;$("skip").disabled=false;$("ans").focus()}
$("hb").onclick=()=>{if(locked||hints>=2)return;hints++;const a=cur[1];
 if(hints===1)$("hint").textContent=cho(a);
 else{const w=a.split(" ");$("hint").textContent=w[0]+(w.length>1?" "+cho(w.slice(1).join(" ")):"")}
 $("hb").textContent=hints>=2?"💡 힌트 끝":"💡 초성 힌트 (1번 남음)";if(hints>=2)$("hb").disabled=true;$("ans").focus()};
$("mb").onclick=()=>{if(locked||mUsed||!cur[2])return;mUsed=true;$("mean").textContent="💬 뜻 힌트: "+cur[2];$("mb").disabled=true;$("ans").focus()};

const cv=$("cv"),cx=cv.getContext("2d");let ps=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
const COL=["#ff4d6d","#ffd93d","#4cd964","#4d96ff","#ff8a3d","#c77dff","#00e5ff","#ffffff"];
const EM=["⭐","✨","🎉","💖","🎈"].map(e=>{const c=document.createElement("canvas");c.width=c.height=32;const x=c.getContext("2d");x.font="26px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(e,16,17);return c});
function burst(x,y){const c1=COL[Math.random()*8|0],c2=COL[Math.random()*8|0],ring=Math.random()<.5;
 for(let i=0;i<40;i++){const a=i/40*6.283,s=ring?5.5:2+Math.random()*5.5;ps.push({t:"s",x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:55+Math.random()*20,m:75,c:i%3?c1:c2})}

function boom(){for(let k=0;k<3;k++)setTimeout(()=>{ps.push({t:"r",x:cv.width*(.15+Math.random()*.7),y:cv.height,vx:(Math.random()-.5)*2,vy:-(cv.height/42)-Math.random()*4,ty:cv.height*(.15+Math.random()*.35)});if(!raf)raf=requestAnimationFrame(draw)},k*200);if(!raf)raf=requestAnimationFrame(draw)}
function draw(){cx.clearRect(0,0,cv.width,cv.height);const n=[];cx.lineWidth=3;cx.lineCap="round";

  if(p.t==="r"){p.x+=p.vx;p.y+=p.vy;cx.globalAlpha=1;cx.fillStyle="#ffe08a";cx.fillRect(p.x-2,p.y,4,16);if(p.y<=p.ty)burst(p.x,p.y);else n.push(p);continue}
  p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vy+=p.t==="s"?.1:.2;p.vx*=.985;if(--p.l<=0)continue;

  else cx.drawImage(p.e,p.x-16,p.y-16);
