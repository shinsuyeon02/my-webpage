<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘, 지금</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480&family=Noto+Serif+KR:wght@400;600&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c98a5e;
    --accent-soft: #e8c9a8;
    --sky-1: #fdf6ee;
    --sky-2: #f3e4d4;
    --ink: #33302b;
    --ink-soft: #7a7369;
    --hairline: rgba(51, 48, 43, 0.14);
    transition: background 1.5s ease;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse 120% 90% at 50% -10%, var(--sky-2), var(--sky-1) 60%);
    padding: 8vh 24px;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- 시간 ---------- */
  .clock {
    text-align: center;
    margin-bottom: 6vh;
  }

  #time {
    font-family: 'Fraunces', 'Noto Serif KR', serif;
    font-weight: 340;
    font-size: clamp(3.6rem, 13vw, 5.4rem);
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  #time .colon {
    color: var(--accent);
    padding: 0 0.05em;
  }

  #date {
    margin-top: 14px;
    font-size: 0.95rem;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }

  #greeting {
    margin-top: 4px;
    font-size: 0.82rem;
    color: var(--accent);
    font-weight: 500;
  }

  /* ---------- 검색 ---------- */
  .search-wrap {
    width: 100%;
    margin-bottom: 7vh;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1.5px solid var(--hairline);
    padding-bottom: 10px;
    transition: border-color 0.25s ease;
  }

  .search-box:focus-within {
    border-color: var(--accent);
  }

  .search-box svg {
    flex-shrink: 0;
    color: var(--ink-soft);
    transition: color 0.25s ease;
  }

  .search-box:focus-within svg {
    color: var(--accent);
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1.02rem;
    color: var(--ink);
    padding: 4px 0;
  }

  .search-box input::placeholder {
    color: var(--ink-soft);
    opacity: 0.75;
  }

  .search-box button {
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 2px;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* ---------- 할 일 ---------- */
  .todo-wrap {
    width: 100%;
  }

  .todo-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .todo-header h2 {
    margin: 0;
    font-family: 'Fraunces', 'Noto Serif KR', serif;
    font-weight: 480;
    font-size: 1.3rem;
    color: var(--ink);
  }

  #todo-count {
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  #todo-list {
    list-style: none;
    margin: 0 0 18px 0;
    padding: 0;
  }

  #todo-list li {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 12px 0;
    border-bottom: 1px solid var(--hairline);
  }

  .todo-empty {
    padding: 20px 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.9rem;
    border-bottom: none !important;
  }

  .check {
    flex-shrink: 0;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-soft);
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s ease, background 0.2s ease;
    background: transparent;
  }

  .check.checked {
    border-color: var(--accent);
    background: var(--accent);
  }

  .check.checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 1.5px;
    width: 5px;
    height: 9px;
    border-right: 1.6px solid #fff;
    border-bottom: 1.6px solid #fff;
    transform: rotate(45deg);
  }

  #todo-list li span {
    flex: 1;
    font-size: 0.98rem;
    color: var(--ink);
    word-break: break-word;
    transition: color 0.2s ease;
  }

  #todo-list li.done span {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--hairline);
  }

  .delete-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 1.05rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
    padding: 4px;
    line-height: 1;
  }

  #todo-list li:hover .delete-btn {
    opacity: 1;
  }

  .delete-btn:hover {
    color: #c0554a;
  }

  .todo-add {
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1.5px solid var(--hairline);
    padding-bottom: 10px;
    transition: border-color 0.25s ease;
  }

  .todo-add:focus-within {
    border-color: var(--accent);
  }

  .todo-add span.plus {
    color: var(--accent-soft);
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .todo-add input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    padding: 4px 0;
  }

  .todo-add input::placeholder {
    color: var(--ink-soft);
    opacity: 0.75;
  }

  @media (max-width: 380px) {
    #time { font-size: 3.1rem; }
  }
</style>
</head>
<body>

  <div class="page">

    <div class="clock">
      <div id="time">--:--</div>
      <div id="date">-년 -월 -일</div>
      <div id="greeting"></div>
    </div>

    <div class="search-wrap">
      <form class="search-box" id="search-form">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="검색어를 입력하세요" autofocus autocomplete="off">
        <button type="submit">검색</button>
      </form>
    </div>

    <div class="todo-wrap">
      <div class="todo-header">
        <h2>오늘의 할 일</h2>
        <span id="todo-count"></span>
      </div>
      <ul id="todo-list"></ul>
      <div class="todo-add">
        <span class="plus">+</span>
        <input type="text" id="todo-input" placeholder="할 일을 적어보세요" autocomplete="off">
      </div>
    </div>

  </div>

<script>
  // ---------- 시간대별 분위기 ----------
  const root = document.documentElement.style;
  const greetingEl = document.getElementById('greeting');

  const palettes = {
    dawn:  { sky1:'#fdf3ee', sky2:'#f2dcd0', accent:'#d98a6b', accentSoft:'#eec6b1', ink:'#3a332f', inkSoft:'#8a7a71', greeting:'좋은 아침이에요' },
    day:   { sky1:'#fbfaf6', sky2:'#e7ecec', accent:'#5c8f8a', accentSoft:'#b9d2ce', ink:'#2f332f', inkSoft:'#78807c', greeting:'활기찬 오후예요' },
    dusk:  { sky1:'#fdf2ea', sky2:'#eecfb0', accent:'#c9723f', accentSoft:'#e8ba8f', ink:'#332a22', inkSoft:'#8a7768', greeting:'노을이 질 시간이에요' },
    night: { sky1:'#20232f', sky2:'#141620', accent:'#8f9ede', accentSoft:'#4d5578', ink:'#e8e8ee', inkSoft:'#8a8ea3', greeting:'고요한 밤이에요' }
  };

  function periodFor(hour) {
    if (hour >= 5 && hour < 8) return 'dawn';
    if (hour >= 8 && hour < 17) return 'day';
    if (hour >= 17 && hour < 20) return 'dusk';
    return 'night';
  }

  let currentPeriod = null;
  function applyPalette(hour) {
    const p = periodFor(hour);
    if (p === currentPeriod) return;
    currentPeriod = p;
    const pal = palettes[p];
    root.setProperty('--sky-1', pal.sky1);
    root.setProperty('--sky-2', pal.sky2);
    root.setProperty('--accent', pal.accent);
    root.setProperty('--accent-soft', pal.accentSoft);
    root.setProperty('--ink', pal.ink);
    root.setProperty('--ink-soft', pal.inkSoft);
    greetingEl.textContent = pal.greeting;
  }

  // ---------- 날짜/시간 ----------
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const days = ['일', '월', '화', '수', '목', '금', '토'];

  function updateDateTime() {
    const now = new Date();
    applyPalette(now.getHours());

    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    timeEl.innerHTML = h + '<span class="colon">:</span>' + m;

    const y = now.getFullYear();
    const mo = now.getMonth() + 1;
    const d = now.getDate();
    const dayName = days[now.getDay()];
    dateEl.textContent = y + '년 ' + mo + '월 ' + d + '일 ' + dayName + '요일';
  }
  updateDateTime();
  setInterval(updateDateTime, 1000);

  // ---------- 검색 ----------
  const searchForm = document.getElementById('search-form');
  const searchInput = document.getElementById('search-input');

  searchForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const query = searchInput.value.trim();
    if (!query) return;
    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
  });

  // ---------- 할 일 ----------
  const todoInput = document.getElementById('todo-input');
  const todoList = document.getElementById('todo-list');
  const todoCount = document.getElementById('todo-count');
  const STORAGE_KEY = 'my-homepage-todos';

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  let todos = loadTodos();

  function renderTodos() {
    todoList.innerHTML = '';

    if (todos.length === 0) {
      const li = document.createElement('li');
      li.className = 'todo-empty';
      li.textContent = '오늘은 아직 할 일이 없어요';
      todoList.appendChild(li);
      todoCount.textContent = '';
      return;
    }

    const doneCount = todos.filter(function(t){ return t.done; }).length;
    todoCount.textContent = doneCount + ' / ' + todos.length;

    todos.forEach(function(todo, index) {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const check = document.createElement('button');
      check.type = 'button';
      check.className = 'check' + (todo.done ? ' checked' : '');
      check.setAttribute('aria-label', '완료 체크');
      check.addEventListener('click', function() {
        todos[index].done = !todos[index].done;
        saveTodos(todos);
        renderTodos();
      });

      const span = document.createElement('span');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'delete-btn';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', '삭제');
      delBtn.addEventListener('click', function() {
        todos.splice(index, 1);
        saveTodos(todos);
        renderTodos();
      });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(delBtn);
      todoList.appendChild(li);
    });
  }

  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ text: text, done: false });
    saveTodos(todos);
    todoInput.value = '';
    renderTodos();
  }

  todoInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addTodo();
    }
  });

  renderTodos();
</script>

</body>
</html>
